<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456"
     viewBox="0 0 456 456"
     xmlns="http://www.w3.org/2000/svg">

	<defs>
		<!-- Wallet Shadow -->
		<filter id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="150%">
			<feDropShadow dx="0"
                          dy="12"
                          stdDeviation="12"
                          flood-color="#000000"
                          flood-opacity="0.18"/>
		</filter>

		<!-- Coin Gradient -->
		<linearGradient id="coin"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
			<stop offset="0%" stop-color="#48C978"/>
			<stop offset="100%" stop-color="#159957"/>
		</linearGradient>

		<!-- Gold -->
		<linearGradient id="gold"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
			<stop offset="0%" stop-color="#FFE27A"/>
			<stop offset="50%" stop-color="#FFC62E"/>
			<stop offset="100%" stop-color="#E8A900"/>
		</linearGradient>
	</defs>


	<!-- ========================= -->
	<!-- BACK CARDS -->
	<!-- ========================= -->

	<!-- Yellow Card -->
	<path d="M105 171
             L286 105
             C304 99 322 108 328 125
             L343 170
             Z"
          fill="url(#gold)"/>

	<!-- Green Card -->
	<path d="M91 181
             L314 132
             C333 128 350 141 354 160
             L358 181
             Z"
          fill="#24A765"/>

	<!-- Card Highlight -->
	<path d="M145 164
             L305 130"
          stroke="#6FE09A"
          stroke-width="8"
          stroke-linecap="round"
          opacity="0.7"/>


	<!-- ========================= -->
	<!-- MAIN WALLET -->
	<!-- ========================= -->

	<path d="M83 157
             H337
             C371 157 395 181 395 215
             V326
             C395 358 373 381 339 381
             H108
             C72 381 49 358 49 324
             V215
             C49 180 68 157 83 157Z"
          fill="#FFFFFF"
          filter="url(#shadow)"/>


	<!-- Wallet Soft Bottom -->
	<path d="M67 326
             C70 347 84 359 108 359
             H337
             C355 359 368 350 375 333"
          fill="none"
          stroke="#E8EDF2"
          stroke-width="7"
          stroke-linecap="round"/>


	<!-- ========================= -->
	<!-- RUPEE COIN -->
	<!-- ========================= -->

	<!-- Coin Shadow -->
	<circle cx="171"
            cy="269"
            r="67"
            fill="#000000"
            opacity="0.08"/>

	<!-- Gold Outer Ring -->
	<circle cx="171"
            cy="261"
            r="65"
            fill="url(#gold)"/>

	<!-- Coin Inner -->
	<circle cx="171"
            cy="261"
            r="53"
            fill="url(#coin)"/>

	<!-- Coin Highlight -->
	<path d="M136 239
             C145 222 160 214 178 214"
          fill="none"
          stroke="#8BE8AE"
          stroke-width="6"
          stroke-linecap="round"
          opacity="0.55"/>

	<!-- Rupee Symbol -->
	<text x="171"
          y="282"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="67"
          font-weight="700"
          fill="#FFFFFF">₹</text>


	<!-- ========================= -->
	<!-- MODERN WALLET CLASP -->
	<!-- ========================= -->

	<path d="M318 218
             H397
             C416 218 429 232 429 250
             V280
             C429 298 416 312 397 312
             H318
             C298 312 283 296 283 276
             V255
             C283 234 298 218 318 218Z"
          fill="#293241"/>

	<!-- Clasp Highlight -->
	<path d="M319 229
             H394"
          stroke="#485568"
          stroke-width="6"
          stroke-linecap="round"
          opacity="0.8"/>

	<!-- Gold Clasp Button -->
	<circle cx="328"
            cy="265"
            r="18"
            fill="url(#gold)"/>

	<circle cx="328"
            cy="265"
            r="8"
            fill="#FFF1B5"/>


	<!-- ========================= -->
	<!-- SMALL WALLET DETAIL -->
	<!-- ========================= -->

	<path d="M221 345
             H327"
          stroke="#EEF1F4"
          stroke-width="7"
          stroke-linecap="round"/>

</svg>