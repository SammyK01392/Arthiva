<svg xmlns="http://www.w3.org/2000/svg"
     width="432"
     height="432"
     viewBox="0 0 432 432">

	<!-- Main MoneySpend A -->
	<path d="M72 315 L216 45 L360 315"
		  fill="none"
		  stroke="#FF8A00"
		  stroke-width="40"
		  stroke-linecap="round"
		  stroke-linejoin="round"/>

	<!-- Growth Bars -->
	<rect x="155" y="225"
		  width="30" height="65"
		  rx="7"
		  fill="#FFD180"/>

	<rect x="200" y="188"
		  width="30" height="102"
		  rx="7"
		  fill="#FFB74D"/>

	<rect x="245" y="142"
		  width="30" height="148"
		  rx="7"
		  fill="#FF9800"/>

	<!-- Growth Curve -->
	<path d="M147 246
           C180 232 216 203 247 165
           C264 145 277 123 289 101"
		  fill="none"
		  stroke="#E86F00"
		  stroke-width="10"
		  stroke-linecap="round"/>

	<!-- Growth Arrow -->
	<path d="M268 108
           L291 98
           L286 123
           Z"
		  fill="#E86F00"/>

	<!-- Rupee Badge -->
	<circle cx="302"
			cy="265"
			r="44"
			fill="#FFD180"
			stroke="#FFA726"
			stroke-width="7"/>

	<!-- Rupee Symbol -->
	<text x="302"
		  y="280"
		  text-anchor="middle"
		  font-size="49"
		  font-family="Arial, Helvetica, sans-serif"
		  font-weight="700"
		  fill="#FF9800">₹</text>

	<!-- MoneySpend Brand Name -->
	<text x="216"
		  y="385"
		  text-anchor="middle"
		  font-size="38"
		  font-family="Arial, Helvetica, sans-serif"
		  font-weight="700"
		  letter-spacing="6"
		  fill="#E86F00">MoneySpend</text>

</svg>