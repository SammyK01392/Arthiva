<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456"
     height="456"
     viewBox="0 0 456 456"
     version="1.1"
     xmlns="http://www.w3.org/2000/svg">

	<defs>

		<!-- Premium Orange -->
		<linearGradient id="orange"
                        x1="90"
                        y1="330"
                        x2="300"
                        y2="110"
                        gradientUnits="userSpaceOnUse">
			<stop offset="0%" stop-color="#E85D04"/>
			<stop offset="55%" stop-color="#FF7A00"/>
			<stop offset="100%" stop-color="#FFB52E"/>
		</linearGradient>

		<!-- Gold -->
		<linearGradient id="gold"
                        x1="280"
                        y1="320"
                        x2="335"
                        y2="220"
                        gradientUnits="userSpaceOnUse">
			<stop offset="0%" stop-color="#E9A400"/>
			<stop offset="50%" stop-color="#FFC928"/>
			<stop offset="100%" stop-color="#FFE58A"/>
		</linearGradient>

		<!-- Green -->
		<linearGradient id="green"
                        x1="285"
                        y1="305"
                        x2="330"
                        y2="235"
                        gradientUnits="userSpaceOnUse">
			<stop offset="0%" stop-color="#168F55"/>
			<stop offset="100%" stop-color="#45C979"/>
		</linearGradient>

		<!-- Soft Shadow -->
		<filter id="shadow"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%">

			<feDropShadow dx="0"
                          dy="8"
                          stdDeviation="8"
                          flood-color="#D85A00"
                          flood-opacity="0.18"/>
		</filter>

	</defs>


	<!-- ===================================== -->
	<!-- MODERN GROWTH BARS -->
	<!-- ===================================== -->

	<!-- Small Bar -->
	<rect x="102"
          y="238"
          width="40"
          height="76"
          rx="11"
          fill="#FFE19A"/>

	<!-- Medium Bar -->
	<rect x="154"
          y="199"
          width="40"
          height="115"
          rx="11"
          fill="#FFC957"/>

	<!-- Large Bar -->
	<rect x="206"
          y="148"
          width="40"
          height="166"
          rx="11"
          fill="url(#orange)"/>


	<!-- ===================================== -->
	<!-- MODERN GROWTH LINE -->
	<!-- ===================================== -->

	<path d="M91 278
             C126 267
             155 249
             183 224
             C211 199
             235 166
             260 127"
          fill="none"
          stroke="#E85D04"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>


	<!-- ===================================== -->
	<!-- UPWARD ARROW -->
	<!-- ===================================== -->

	<path d="M244 134
             L265 116
             L260 145"
          fill="#E85D04"/>


	<!-- ===================================== -->
	<!-- PREMIUM RUPEE COIN -->
	<!-- ===================================== -->

	<!-- Shadow -->
	<circle cx="318"
            cy="278"
            r="54"
            fill="#000000"
            opacity="0.08"/>

	<!-- White Outer -->
	<circle cx="318"
            cy="270"
            r="51"
            fill="#FFFFFF"
            filter="url(#shadow)"/>

	<!-- Gold Ring -->
	<circle cx="318"
            cy="270"
            r="46"
            fill="url(#gold)"/>

	<!-- Green Center -->
	<circle cx="318"
            cy="270"
            r="35"
            fill="url(#green)"/>

	<!-- Coin Highlight -->
	<path d="M297 254
             C303 245
             312 241
             322 241"
          fill="none"
          stroke="#94E9B5"
          stroke-width="4"
          stroke-linecap="round"
          opacity="0.75"/>

	<!-- Rupee -->
	<text x="318"
          y="285"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="44"
          font-weight="700"
          fill="#FFFFFF">₹</text>


	<!-- ===================================== -->
	<!-- MODERN WORDMARK -->
	<!-- ===================================== -->

	<text x="228"
          y="365"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="31"
          font-weight="700"
          letter-spacing="0.8">

		<tspan fill="#D95400">Money</tspan>
		<tspan fill="#FF9F1C">Spend</tspan>

	</text>


	<!-- ===================================== -->
	<!-- PREMIUM WORDMARK ACCENT -->
	<!-- ===================================== -->

	<rect x="178"
          y="382"
          width="100"
          height="4"
          rx="2"
          fill="url(#gold)"/>

</svg>